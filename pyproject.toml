[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdf-reader"
version = "0.3.0"
description = "Reader for CASPEX SWIR camera frames in RAMSES SDF files"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
plot = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sdf_reader*"]
